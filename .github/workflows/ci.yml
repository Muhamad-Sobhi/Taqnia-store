name: Store CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  store:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/store/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check Drizzle migration history
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: taqnia_store_test
          DATABASE_USER: migration_check
          DATABASE_PASSWORD: migration_check_only
        run: npm run db:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end smoke tests
        run: npm run test:e2e
